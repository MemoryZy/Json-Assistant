# GitHub Actions Workflow is created for testing and preparing the plugin release in the following steps:
# - Validate Gradle Wrapper.
# - Run 'test' and 'verifyPlugin' tasks.
# - Run Qodana inspections.
# - Run the 'buildPlugin' task and prepare artifact for further tests.
# - Run the 'runPluginVerifier' task.
# - Create a draft release.
#
# The workflow is triggered on push and pull_request events.
#
# GitHub Actions reference: https://help.github.com/en/actions
#
## JBIJPPTPL

name: Build
on:
  # Trigger the workflow on pushes to only the 'main' branch (this avoids duplicate checks being run e.g., for dependabot pull requests)
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/**'
      - '.gitignore'
      - 'README.md'
      - 'README_zh.md'
      - 'CHANGELOG.md'
      - 'DESCRIPTION.md'
      - 'ANNOUNCEMENTS'
      - 'donors.json'
      - 'NOTICE'

  # Trigger the workflow on any pull request
  pull_request:
    paths-ignore:
      - '.github/**'
      - '.gitignore'
      - 'README.md'
      - 'README_zh.md'
      - 'CHANGELOG.md'
      - 'DESCRIPTION.md'
      - 'ANNOUNCEMENTS'
      - 'donors.json'
      - 'NOTICE'

  # 可手动操控
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:

  # Prepare environment and build the plugin
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.properties.outputs.version }}
      changelog: ${{ steps.properties.outputs.changelog }}
      pluginVerifierHomeDir: ${{ steps.properties.outputs.pluginVerifierHomeDir }}
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v4

      # Validate wrapper
      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@v3

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 11

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true   # 仅读取缓存，不写入新缓存

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      # Set environment variables
      - name: Export Properties
        id: properties
        shell: bash
        run: |
          PROPERTIES="$(./gradlew properties --console=plain -q)"
          VERSION="$(echo "$PROPERTIES" | grep "^version:" | cut -f2- -d ' ')"
          RAW_CHANGELOG="$(./gradlew getChangelog --unreleased --no-header --console=plain -q)"

          echo "version: $VERSION"
          echo "raw_changelog:"
          echo "$RAW_CHANGELOG"

          # 删除 [Unreleased] 标题行、链接行及其后的空行
          CHANGELOG=$(echo "$RAW_CHANGELOG" | sed -e '/^## \[Unreleased\]/{N;d;}' -e '/^\[Unreleased\]:.*/d' -e '/^$/d')
          echo "changelog:"
          echo "$CHANGELOG"
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "pluginVerifierHomeDir=~/.pluginVerifier" >> $GITHUB_OUTPUT
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

#          ./gradlew listProductsReleases # prepare list of IDEs for Plugin Verifier
#
#      - name: Cat Products Releases
#        run: cat build/listProductsReleases.txt

      # Build plugin
      - name: Build plugin
        env:
          CI_MODE: "true" # 设置 CI 标识
        run: ./gradlew buildPlugin

      # Prepare plugin archive content for creating artifact
      - name: Prepare Plugin Artifact
        id: artifact
        shell: bash
        run: |
          cd ${{ github.workspace }}/build/distributions
          FILENAME=`ls *.zip`
          unzip "$FILENAME" -d content

          echo "filename=${FILENAME:0:-4}" >> $GITHUB_OUTPUT

      # Store already-built plugin as an artifact for downloading
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.filename }}
          path: ./build/distributions/content/*/*
          retention-days: 2  # 2天后自动删除

      - name: Cleanup build artifacts
        run: rm -rf ${{ github.workspace }}/build/distributions

